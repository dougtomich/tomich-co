[build]
  publish = "."

# Redirect www to apex
[[redirects]]
  from = "https://www.tomichllc.com/*"
  to = "https://tomichllc.com/:splat"
  status = 301
  force = true

# Old domain redirect
[[redirects]]
  from = "https://www.tomich.co/*"
  to = "https://tomichllc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://tomich.co/*"
  to = "https://tomichllc.com/:splat"
  status = 301
  force = true

# Old category paths → new /gear/ paths
[[redirects]]
  from = "/ultrarunning/*"
  to = "/gear/ultrarunning/:splat"
  status = 301

[[redirects]]
  from = "/ultrarunning"
  to = "/gear/ultrarunning/"
  status = 301

[[redirects]]
  from = "/f3/*"
  to = "/gear/f3/:splat"
  status = 301

[[redirects]]
  from = "/f3"
  to = "/gear/f3/"
  status = 301

[[redirects]]
  from = "/kilimanjaro/*"
  to = "/gear/kilimanjaro/:splat"
  status = 301

[[redirects]]
  from = "/kilimanjaro"
  to = "/gear/kilimanjaro/"
  status = 301

[[redirects]]
  from = "/lifestyle/*"
  to = "/gear/lifestyle/:splat"
  status = 301

[[redirects]]
  from = "/lifestyle"
  to = "/gear/lifestyle/"
  status = 301

# Old disclaimer path
[[redirects]]
  from = "/disclaimer.html"
  to = "/gear/disclaimer.html"
  status = 301

# Pretty URLs for new sections
[[redirects]]
  from = "/gear"
  to = "/gear/"
  status = 301

[[redirects]]
  from = "/hair"
  to = "/hair/"
  status = 301

[[redirects]]
  from = "/kitchen"
  to = "/kitchen/"
  status = 301

# Headers for performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
